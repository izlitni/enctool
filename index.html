<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Dashboard v6 (Lite Mode)</title>
    <!-- CryptoJS Full Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --accent: #8b5cf6;
            --warning: #f59e0b;
        }

        * { box-sizing: border-box; outline: none; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .dashboard {
            width: 100%;
            max-width: 1000px;
            background: var(--bg-card);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background: rgba(0,0,0,0.2);
            padding: 20px;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        h1 { margin: 0; font-size: 1.2rem; font-family: 'JetBrains Mono', monospace; color: var(--primary); }
        .badge { font-size: 0.7rem; background: #334155; padding: 4px 8px; border-radius: 4px; color: var(--text-muted); }

        /* Toggle Switch */
        .mode-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--bg-dark);
            transition: .4s;
            border-radius: 24px;
            border: 1px solid #334155;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--accent); border-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(24px); }

        /* Tabs */
        .tabs {
            display: flex;
            background: #0f172a;
            flex-wrap: wrap;
        }
        .tab-btn {
            flex: 1;
            min-width: 120px;
            padding: 15px;
            background: transparent;
            color: var(--text-muted);
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
            border-bottom: 2px solid transparent;
        }
        .tab-btn:hover { background: #1e293b; color: white; }
        .tab-btn.active {
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
            background: var(--bg-card);
        }

        /* Content Sections */
        .content-section {
            padding: 25px;
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }
        .content-section.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* Forms & Inputs */
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: var(--text-muted); }
        
        textarea, input[type="text"], input[type="password"], input[type="url"], select {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            padding: 12px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            transition: 0.2s;
        }
        textarea:focus, input:focus, select:focus { border-color: var(--primary); }

        /* Buttons */
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn:hover { background: var(--primary-hover); }
        .btn-danger { background: var(--danger); }
        .btn-accent { background: var(--accent); }
        
        /* Results */
        .hash-row {
            display: flex;
            align-items: center;
            background: #0f172a;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
        }
        .hash-label { width: 100px; font-weight: bold; color: var(--accent); font-size: 0.8rem; }
        .hash-value { flex: 1; font-family: 'JetBrains Mono', monospace; word-break: break-all; font-size: 0.8rem; color: #cbd5e1; }
        .copy-btn {
            background: transparent;
            border: 1px solid #334155;
            color: var(--text-muted);
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.7rem;
            margin-left: 10px;
            min-width: 50px;
        }
        .copy-btn:hover { background: #334155; color: white; }

        /* AES Section */
        .aes-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .subsection-title { color: white; border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 20px; font-size: 1.1rem; }
        @media(max-width: 700px) { .aes-grid { grid-template-columns: 1fr; } }

        /* Cracker Terminal */
        .terminal {
            background: #000;
            color: #0f0;
            padding: 15px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            height: 200px;
            overflow-y: auto;
            font-size: 0.8rem;
            border: 1px solid #333;
            margin-top: 15px;
        }
        .success-msg { color: var(--success); font-weight: bold; }
        .fail-msg { color: var(--danger); }
        .warn-msg { color: var(--warning); }

        /* File Area */
        .drop-zone {
            border: 2px dashed #334155;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            color: var(--text-muted);
            margin-bottom: 10px;
        }
        .drop-zone:hover { border-color: var(--primary); background: rgba(59, 130, 246, 0.05); }
        .file-info { font-size: 0.8rem; color: var(--primary); text-align: center; min-height: 20px; }
    </style>
</head>
<body>

<div class="dashboard">
    <header>
        <div>
            <h1><span style="color:white;">CRYPTO</span>TOOLKIT <span style="color:var(--accent);">v6</span></h1>
            <span class="badge">Lite & Pro Modes</span>
        </div>
        
        <div class="mode-toggle">
            <span id="modeLabel">LITE Mode</span>
            <label class="switch">
                <input type="checkbox" id="modeSwitch" onclick="toggleMode()">
                <span class="slider"></span>
            </label>
        </div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('textHash')">Text Hash</button>
        <button class="tab-btn" onclick="switchTab('fileHash')">File Hash</button>
        <button class="tab-btn" onclick="switchTab('aesCrypt')">AES Utils</button>
        <button class="tab-btn" onclick="switchTab('cracker')">Hash Analyzer</button>
    </div>

    <!-- 1. Text Hasher -->
    <div id="textHash" class="content-section active">
        <div class="input-group">
            <label>Input Text</label>
            <textarea id="txtInput" rows="2" placeholder="Type text here..." oninput="updateTextHashes()"></textarea>
        </div>
        <div id="textResults"></div>
    </div>

    <!-- 2. File Hasher -->
    <div id="fileHash" class="content-section">
        <div class="drop-zone" onclick="document.getElementById('fileInputHash').click()">
            <p>Click to Upload or Drag & Drop File</p>
            <input type="file" id="fileInputHash" style="display:none" onchange="processFileHash()">
        </div>
        <p id="fileNameHash" class="file-info"></p>
        <div id="fileResults" style="margin-top:20px;"></div>
    </div>

    <!-- 3. AES Encryption (Standard) -->
    <div id="aesCrypt" class="content-section">
        <h3 class="subsection-title">1. Text Encryption</h3>
        <div class="aes-grid">
            <div>
                <label>Plain Text</label>
                <textarea id="aesPlain" rows="2" placeholder="Secret data..."></textarea>
                <label>Key</label>
                <input type="password" id="aesKeyEnc" placeholder="Password">
                <button class="btn" style="margin-top:10px; width:100%" onclick="doAesEncrypt()">Encrypt Text</button>
            </div>
            <div>
                <label>Cipher Text</label>
                <textarea id="aesCipher" rows="2" placeholder="Encrypted data..."></textarea>
                <label>Key</label>
                <input type="password" id="aesKeyDec" placeholder="Password">
                <button class="btn btn-accent" style="margin-top:10px; width:100%" onclick="doAesDecrypt()">Decrypt Text</button>
            </div>
        </div>
        <div class="input-group">
            <label>Text Result</label>
            <textarea id="aesResult" rows="2" readonly style="color: var(--success); border-color: var(--success);"></textarea>
        </div>

        <h3 class="subsection-title" style="margin-top: 40px;">2. File Encryption</h3>
        <div class="aes-grid">
            <div>
                <label>Encrypt File</label>
                <div class="drop-zone" onclick="document.getElementById('aesFileIn').click()">Select File to Encrypt<input type="file" id="aesFileIn" style="display:none" onchange="updateFileName('aesFileIn', 'aesFileInName')"></div>
                <div id="aesFileInName" class="file-info"></div>
                <input type="password" id="aesFileKeyEnc" placeholder="Strong Password" style="margin-top:10px">
                <button class="btn" style="margin-top:10px; width:100%" onclick="encryptFile()">Encrypt & Download</button>
                <div id="encFileStatus" class="file-info" style="margin-top:5px"></div>
            </div>
            <div>
                <label>Decrypt File</label>
                <div class="drop-zone" onclick="document.getElementById('aesFileOut').click()">Select Encrypted File<input type="file" id="aesFileOut" style="display:none" onchange="updateFileName('aesFileOut', 'aesFileOutName')"></div>
                <div id="aesFileOutName" class="file-info"></div>
                <input type="password" id="aesFileKeyDec" placeholder="Strong Password" style="margin-top:10px">
                <button class="btn btn-accent" style="margin-top:10px; width:100%" onclick="decryptFile()">Decrypt & Download</button>
                <div id="decFileStatus" class="file-info" style="margin-top:5px"></div>
            </div>
        </div>
    </div>

    <!-- 4. Hash Analyzer -->
    <div id="cracker" class="content-section">
        <div class="input-group">
            <label>Target Hash</label>
            <input type="text" id="targetHash" placeholder="Paste hash here...">
        </div>
        <div class="input-group">
            <label>Dictionary Source</label>
            <select id="dictSource" onchange="toggleDictSource()">
                <option value="internal">Internal (Small - Demo)</option>
                <option value="upload">Upload Custom Wordlist (.txt)</option>
                <option value="url" selected>Load from URL (Raw Text)</option>
            </select>
        </div>
        <div id="uploadArea" class="input-group" style="display:none;">
            <label>Upload Wordlist (.txt)</label>
            <input type="file" id="wordlistFile" accept=".txt">
        </div>
        <div id="urlArea" class="input-group">
            <label>Wordlist URL</label>
            <input type="url" id="wordlistUrl" placeholder="https://github.com/.../list.txt" value="https://github.com/danielmiessler/SecLists/blob/master/Passwords/Cracked-Hashes/milw0rm-dictionary.txt">
            <p style="font-size:0.75rem; color:var(--text-muted); margin-top:5px;">Note: GitHub links are auto-converted to Raw.</p>
        </div>
        <button class="btn btn-danger" onclick="startCrack()">Run Attack</button>
        <div id="crackLog" class="terminal">> System Ready...</div>
    </div>
</div>

<script>
    // --- Mode State ---
    let isLiteMode = true; // Default to Lite Mode (MD5, SHA1, SHA256 only)

    function toggleMode() {
        const toggle = document.getElementById('modeSwitch');
        isLiteMode = !toggle.checked; // If checked, it's Pro mode
        
        const label = document.getElementById('modeLabel');
        if(isLiteMode) {
            label.innerText = "LITE Mode";
            label.style.color = "#94a3b8";
        } else {
            label.innerText = "PRO Mode";
            label.style.color = "#8b5cf6"; // Accent color
        }

        // Refresh active views
        updateTextHashes();
        // If file loaded, refresh it too
        if(document.getElementById('fileNameHash').innerText !== "") {
            processFileHash();
        }
    }

    // --- UI Helpers ---
    function switchTab(id) {
        document.querySelectorAll('.content-section').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.target.classList.add('active');
    }

    function createHashRow(label, value) {
        return `
        <div class="hash-row">
            <div class="hash-label">${label}</div>
            <div class="hash-value">${value}</div>
            <button class="copy-btn" onclick="navigator.clipboard.writeText('${value}')">COPY</button>
        </div>`;
    }

    function updateFileName(inputId, displayId) {
        const file = document.getElementById(inputId).files[0];
        document.getElementById(displayId).innerText = file ? file.name : "";
    }

    // --- 1. Text Hashing ---
    function updateTextHashes() {
        const text = document.getElementById('txtInput').value;
        const div = document.getElementById('textResults');
        if(!text) { div.innerHTML = ''; return; }
        
        let html = '';
        html += createHashRow('MD5', CryptoJS.MD5(text));
        html += createHashRow('SHA-1', CryptoJS.SHA1(text));
        html += createHashRow('SHA-256', CryptoJS.SHA256(text));

        // Only show extended algos if NOT in lite mode
        if(!isLiteMode) {
            html += createHashRow('SHA-512', CryptoJS.SHA512(text));
            html += createHashRow('SHA-224', CryptoJS.SHA224(text));
            html += createHashRow('SHA-384', CryptoJS.SHA384(text));
            html += createHashRow('SHA-3', CryptoJS.SHA3(text));
            html += createHashRow('RIPEMD-160', CryptoJS.RIPEMD160(text));
        }
        
        div.innerHTML = html;
    }

    // --- 2. File Hashing ---
    function processFileHash() {
        const file = document.getElementById('fileInputHash').files[0];
        if (!file) return;
        document.getElementById('fileNameHash').innerText = `Selected: ${file.name}`;
        const results = document.getElementById('fileResults');
        results.innerHTML = '<div style="color:var(--primary)">Processing...</div>';
        
        const reader = new FileReader();
        reader.onload = function(e) {
            const data = CryptoJS.enc.Latin1.parse(e.target.result);
            let html = '';
            html += createHashRow('MD5', CryptoJS.MD5(data));
            html += createHashRow('SHA-1', CryptoJS.SHA1(data));
            html += createHashRow('SHA-256', CryptoJS.SHA256(data));

            if(!isLiteMode) {
                html += createHashRow('SHA-512', CryptoJS.SHA512(data));
                html += createHashRow('SHA-3', CryptoJS.SHA3(data));
            }
            results.innerHTML = html;
        };
        reader.readAsBinaryString(file);
    }

    // --- 3. AES Utils (Standard) ---
    function doAesEncrypt() {
        const msg = document.getElementById('aesPlain').value;
        const key = document.getElementById('aesKeyEnc').value;
        if(!msg || !key) return alert("Enter text and key");
        document.getElementById('aesResult').value = CryptoJS.AES.encrypt(msg, key).toString();
    }
    function doAesDecrypt() {
        const cipher = document.getElementById('aesCipher').value;
        const key = document.getElementById('aesKeyDec').value;
        if(!cipher || !key) return alert("Enter cipher and key");
        try {
            const bytes = CryptoJS.AES.decrypt(cipher, key);
            const original = bytes.toString(CryptoJS.enc.Utf8);
            document.getElementById('aesResult').value = original || "Error: Bad Key";
        } catch(e) { document.getElementById('aesResult').value = "Error: Decryption Failed"; }
    }
    function encryptFile() {
        const fileInput = document.getElementById('aesFileIn');
        const key = document.getElementById('aesFileKeyEnc').value;
        const status = document.getElementById('encFileStatus');
        if(!fileInput.files.length || !key) return alert("Select file and password");
        status.innerText = "Processing...";
        const reader = new FileReader();
        reader.onload = function(e) {
            setTimeout(() => {
                const encrypted = CryptoJS.AES.encrypt(e.target.result, key).toString();
                const blob = new Blob([encrypted], {type: "text/plain"});
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = fileInput.files[0].name + ".encrypted";
                link.click();
                status.innerText = "Done!";
            }, 50);
        };
        reader.readAsDataURL(fileInput.files[0]);
    }
    function decryptFile() {
        const fileInput = document.getElementById('aesFileOut');
        const key = document.getElementById('aesFileKeyDec').value;
        const status = document.getElementById('decFileStatus');
        if(!fileInput.files.length || !key) return alert("Select file and password");
        status.innerText = "Processing...";
        const reader = new FileReader();
        reader.onload = function(e) {
            setTimeout(() => {
                try {
                    const decrypted = CryptoJS.AES.decrypt(e.target.result, key).toString(CryptoJS.enc.Utf8);
                    if(!decrypted.startsWith("data:")) throw new Error();
                    fetch(decrypted).then(res=>res.blob()).then(blob=>{
                        const link = document.createElement("a");
                        link.href = URL.createObjectURL(blob);
                        link.download = "decrypted_" + fileInput.files[0].name.replace(".encrypted", "");
                        link.click();
                        status.innerText = "Done!";
                    });
                } catch(err) { status.innerText = "Failed: Wrong password or bad file."; }
            }, 50);
        };
        reader.readAsText(fileInput.files[0]);
    }

    // --- 4. Cracker Logic ---
    const internalDict = ["123456", "password", "12345678", "qwerty", "admin", "welcome", "love", "secret", "god", "111111"];
    function toggleDictSource() {
        const val = document.getElementById('dictSource').value;
        document.getElementById('uploadArea').style.display = (val === 'upload') ? 'block' : 'none';
        document.getElementById('urlArea').style.display = (val === 'url') ? 'block' : 'none';
    }

    async function startCrack() {
        const target = document.getElementById('targetHash').value.trim();
        const mode = document.getElementById('dictSource').value;
        const log = document.getElementById('crackLog');
        log.innerHTML = `> Initializing ${isLiteMode ? "LITE" : "PRO"} Attack Vector...<br>`;
        if(!target) { log.innerHTML += '<span class="fail-msg">Error: No Target Hash</span>'; return; }

        // Load Wordlist
        let wordlist = [];
        try {
            if(mode === 'internal') wordlist = internalDict;
            else if(mode === 'upload') {
                const f = document.getElementById('wordlistFile').files[0];
                if(!f) throw new Error("No file");
                wordlist = (await f.text()).split(/\r?\n/);
            } else if(mode === 'url') {
                let url = document.getElementById('wordlistUrl').value;
                if(url.includes('github.com') && url.includes('/blob/')) url = url.replace('github.com', 'raw.githubusercontent.com').replace('/blob/', '/');
                const res = await fetch(url);
                if(!res.ok) throw new Error("Fetch failed");
                wordlist = (await res.text()).split(/\r?\n/);
            }
        } catch(e) { log.innerHTML += `<span class="fail-msg">${e.message}</span>`; return; }

        log.innerHTML += `> Loaded ${wordlist.length} words.<br>> Running...<br>`;

        let found = false;
        const chunkSize = 200;
        
        for (let i = 0; i < wordlist.length; i += chunkSize) {
            const chunk = wordlist.slice(i, i + chunkSize);
            await new Promise(r => setTimeout(r, 0)); 

            for(let word of chunk) {
                if(!word) continue;
                
                // --- LITE MODE CHECKS ---
                if(CryptoJS.MD5(word).toString() == target) { logMatch(word, "MD5", log); found=true; break; }
                if(CryptoJS.SHA1(word).toString() == target) { logMatch(word, "SHA-1", log); found=true; break; }
                if(CryptoJS.SHA256(word).toString() == target) { logMatch(word, "SHA-256", log); found=true; break; }

                // --- PRO MODE CHECKS ---
                if(!isLiteMode) {
                    if(CryptoJS.SHA512(word).toString() == target) { logMatch(word, "SHA-512", log); found=true; break; }
                    if(CryptoJS.SHA3(word).toString() == target) { logMatch(word, "SHA-3", log); found=true; break; }
                }
            }
            if(found) break;
        }

        if(!found) log.innerHTML += `<br><span class="fail-msg">> FAILURE.</span> Hash not found.`;
        log.scrollTop = log.scrollHeight;
    }

    function logMatch(word, algo, log) {
        log.innerHTML += `<br><span class="success-msg">>> CRACKED [${algo}] <<</span><br>Match: <span style="font-size:1.2em; color:white; background:#222; padding:2px;">${word}</span><br>`;
    }
    
    toggleDictSource();
</script>
</body>
</html>
